[workspace]
resolver = "2"
members = ["crates/deckle-core", "crates/deckle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"

[profile.release]
opt-level = 3

# Tests render and decode real pages; unoptimised that is minutes, not seconds.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
